name: Feature request
description: Suggest an improvement to Lufa Design System
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and API, including accessibility considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing patterns or workarounds you considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, or related references.
