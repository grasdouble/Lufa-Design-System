name: Global:Tools:Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  Check-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ github.token }}

      - name: 🧪 Check CI authentication configuration
        run: pnpm test:ci-auth

      - name: Run shared pnpm quality checks
        id: check-quality
        uses: grasdouble/Lufa-CICD/actions/check-quality@check-quality-v1
        with:
          install-command: pnpm install --frozen-lockfile
          build-command: pnpm all:build
          lint-command: pnpm all:lint
          typecheck-command: pnpm all:typecheck
          format-command: pnpm all:prettier:check

      - name: Lint CI authentication test
        if: always() && steps.check-quality.outputs.install-succeeded == 'true'
        run: pnpm exec eslint scripts/ci-auth.test.mjs

      - name: Test CLI with coverage
        if: always() && steps.check-quality.outputs.build-succeeded == 'true'
        run: pnpm --filter @grasdouble/lufa_design-system-cli run test:coverage

      - name: Test VS Code extension
        if: always() && steps.check-quality.outputs.build-succeeded == 'true'
        run: pnpm --filter @grasdouble/lufa_plugin_vscode_lufa-ds-preview run test

      - name: Build production VS Code extension
        if: always() && steps.check-quality.outputs.build-succeeded == 'true'
        run: pnpm --filter @grasdouble/lufa_plugin_vscode_lufa-ds-preview run build:production
