name: Global:Tools:Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  Check-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ github.token }}

      - name: 🧪 Check CI authentication configuration
        run: pnpm test:ci-auth

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint CI authentication test
        run: pnpm exec eslint scripts/ci-auth.test.mjs

      # Step 5: Build packages (needed for type checking)
      - name: 🏗️ Build packages
        run: pnpm all:build

      - name: 🧪 Test CLI with coverage
        run: pnpm --filter @grasdouble/lufa_design-system-cli run test:coverage

      - name: 🧪 Test VS Code extension
        run: pnpm --filter @grasdouble/lufa_plugin_vscode_lufa-ds-preview run test

      - name: 📦 Build production VS Code extension
        run: pnpm --filter @grasdouble/lufa_plugin_vscode_lufa-ds-preview run build:production

      # Step 6: Run lint
      - name: 🧹 Run lint
        if: always()
        run: pnpm all:lint

      # Step 7: Run type checking
      - name: 🔍 Run type checking
        if: always()
        run: pnpm all:typecheck

      # Step 8: Check formatting
      - name: 🎨 Check formatting
        if: always()
        id: prettier
        run: |
          echo "::group::Prettier Format Check"
          pnpm all:prettier:check
          echo "::endgroup::"
        continue-on-error: true
