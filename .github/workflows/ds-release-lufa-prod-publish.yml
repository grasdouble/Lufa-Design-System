name: DS:Release:Lufa:Prod-Publish
# Publish Lufa artifacts (Storybook or documentation) to production via FTP.
# Manually triggered with a choice of target.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to publish'
        required: true
        type: choice
        options:
          - storybook
          - documentation

permissions:
  contents: read
  deployments: write
  actions: none
  checks: none
  issues: none
  packages: read
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'storybook' && 'lufa-storybook' || 'lufa-documentation' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ github.token }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build design system
        uses: ./.github/actions/design-system-build
        with:
          build-storybook: ${{ inputs.target == 'storybook' && 'true' || 'false' }}
          build-docusaurus: ${{ inputs.target == 'documentation' && 'true' || 'false' }}

      - name: 📂 Deploy to FTP
        uses: grasdouble/Lufa-CICD/actions/ftp-deploy@ftp-deploy-v1
        with:
          server: ${{ secrets.LUFA_FTP_URL }}
          port: ${{ secrets.LUFA_FTP_PORT }}
          protocol: ${{ secrets.LUFA_FTP_PROTOCOL }}
          username: ${{ secrets.LUFA_FTP_LOGIN }}
          password: ${{ secrets.LUFA_FTP_PWD }}
          local-dir: ${{ inputs.target == 'storybook' && './packages/design-system/storybook/storybook-static/' || './packages/design-system/docusaurus/build/' }}
